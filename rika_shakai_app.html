<html lang="ja">
<head>
<meta charset="utf-8">

<title>理科・社会 理解度チェック</title>
<style>
:root{--bg:#f4f6f8;--surf:#fff;--ink:#14213d;--mute:#5b6678;--line:#d8dee6;--acc:#0f6e8c;--ok:#2e7d4f;--mid:#9a6b00;--ng:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 18px 40px}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--mute);font-size:14px;margin:0 0 18px}
.total{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:6px}
.total b{font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.total span{font-size:16px;color:var(--mute)}
.row{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px;color:inherit;font:inherit;cursor:pointer}
.row:focus-visible,.btn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.rh{display:flex;justify-content:space-between;align-items:baseline}
.rh strong{font-size:17px}
.lv{font-size:14px;font-weight:700}
.bar{height:8px;background:var(--line);border-radius:4px;margin:8px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--acc)}
.meta{font-size:13px;color:var(--mute)}
.ok{color:var(--ok)}.mid{color:var(--mid)}.ng{color:var(--ng)}.none{color:var(--mute)}
.bar i.ok{background:var(--ok)}.bar i.mid{background:var(--mid)}.bar i.ng{background:var(--ng)}
.grp{font-size:14px;color:var(--mute);margin:22px 0 0;font-weight:700}
.acts{display:grid;gap:10px;margin-top:26px}
.btn{font:inherit;font-weight:700;padding:14px 16px;border-radius:10px;border:2px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer;min-height:48px}
:root[data-theme="dark"] .btn,:root:not([data-theme="light"]) .btn{color:#06222c}
.btn.sec{background:transparent;color:var(--acc)}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--mute);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:10px 0}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:14px;margin-bottom:22px}
.q{font-size:21px;line-height:1.6;font-weight:700;margin:8px 0 26px;min-height:110px}
.tag{font-size:14px;color:var(--acc);font-weight:700}
.a{border-left:4px solid var(--acc);padding:6px 0 6px 14px;margin:0 0 22px;font-size:18px}
.a small{display:block;color:var(--mute);font-size:13px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.three .btn{padding:12px 4px;font-size:15px;background:var(--surf);color:var(--ink);border-color:var(--line)}
.three .btn:nth-child(1){border-color:var(--ok)}.three .btn:nth-child(2){border-color:var(--mid)}.three .btn:nth-child(3){border-color:var(--ng)}
.res{margin:30px 0 10px;font-size:18px}
.tm{height:6px;background:var(--line);border-radius:3px;margin:-10px 0 18px;overflow:hidden}.tm i{display:block;height:100%;width:100%;background:var(--acc)}.tm i.low{background:var(--ng)}
.lim{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:22px;font-size:14px;color:var(--mute)}.lim span{margin-right:4px}.lim button{font:inherit;font-size:14px;padding:8px 12px;min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surf);color:var(--ink);cursor:pointer}.lim button[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);font-weight:700}
.late{color:var(--ng);font-weight:700;margin:0 0 10px}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
</style>
</head>

var S={};
try{S=JSON.parse(localStorage.getItem("rikaApp")||"{}")||{}}catch(e){S={}}
function save(){try{localStorage.setItem("rikaApp",JSON.stringify(S))}catch(e){}}
var T=0;
try{T=+localStorage.getItem("rikaT")||0}catch(e){T=0}
function k(f,i){return f+"-"+i}
function lv(p,a){return a===0?["未学習","none"]:p>=80?["得意","ok"]:p>=50?["あと一歩","mid"]:["要復習","ng"]}
function stat(f){var n=F[f].q.length,s=0,a=0;for(var i=0;i<n;i++){var v=S[k(f,i)];if(v!==undefined){s+=v;a++}}return{p:Math.round(s/(2*n)*100),a:a,n:n}}
function all(){var l=[];F.forEach(function(x,f){x.q.forEach(function(_,i){l.push([f,i])})});return l}
function weak(){return all().filter(function(c){var v=S[k(c[0],c[1])];return v!==undefined&&v<2})}
var app=document.getElementById("app");
function home(){
  var tot=0,max=0,ans=0,h="";
  F.forEach(function(x,f){var s=stat(f);tot+=s.p*s.n;max+=s.n;ans+=s.a});
  var overall=Math.round(tot/max),o=lv(overall,ans),w=weak().length,last="";
  h+='<h1>理科・社会 理解度チェック</h1><p class="sub">答えを見たあとで、自分の理解度を3段階で記録します。</p>';
  h+='<div class="total"><b class="'+o[1]+'">'+overall+'</b><span>% 全体の理解度('+o[0]+')</span></div>';
  F.forEach(function(x,f){
    var s=stat(f),l=lv(s.p,s.a);
    if(x.g!==last){h+='<p class="grp">'+x.g+'</p>';last=x.g}
    h+='<button class="row" data-f="'+f+'"><div class="rh"><strong>'+x.n+'</strong><span class="lv '+l[1]+'">'+l[0]+" "+s.p+'%</span></div><div class="bar"><i class="'+l[1]+'" style="width:'+s.p+'%"></i></div><div class="meta">回答済み '+s.a+'/'+s.n+'問</div></button>';
  });
  h+='<div class="lim"><span>1問の制限時間</span>'+[0,15,30,60].map(function(t){return '<button data-t="'+t+'" aria-pressed="'+(T===t)+'">'+(t?t+'秒':'なし')+'</button>'}).join("")+'</div>';
  h+='<div class="acts"><button class="btn" id="goAll">全分野を解く</button><button class="btn sec" id="goWeak"'+(w?'':' disabled')+'>苦手を復習する('+w+'問)</button><button class="link" id="reset">記録をリセットする</button></div>';
  app.innerHTML=h;
  Array.prototype.forEach.call(app.querySelectorAll(".row"),function(b){b.onclick=function(){var f=+b.dataset.f;quiz(F[f].q.map(function(_,i){return[f,i]}))}});
  document.getElementById("goAll").onclick=function(){quiz(all())};
  Array.prototype.forEach.call(app.querySelectorAll(".lim button"),function(b){b.onclick=function(){T=+b.dataset.t;try{localStorage.setItem("rikaT",T)}catch(e){}home()}});
  document.getElementById("goWeak").onclick=function(){quiz(weak())};
  document.getElementById("reset").onclick=function(){if(confirm("すべての記録を消します。よろしいですか。")){S={};save();home()}};

}
function quiz(list){
  var idx=0,got=[0,0,0];
  function show(){
    if(idx>=list.length){
      app.innerHTML='<h1>おつかれさま</h1><p class="res">できた '+got[2]+'問 / あやしい '+got[1]+'問 / できなかった '+got[0]+'問</p><p class="sub">「あやしい」と「できなかった」は、ホームの「苦手を復習する」でもう一度解けます。</p><div class="acts"><button class="btn" id="home">ホームで理解度を見る</button></div>';
      document.getElementById("home").onclick=home;return;
    }
    var c=list[idx],x=F[c[0]],q=x.q[c[1]];
    app.innerHTML='<div class="top"><button class="link" id="back">やめる</button><span>'+(idx+1)+' / '+list.length+'</span></div>'+(T?'<div class="tm" aria-hidden="true"><i id="tmi"></i></div>':'')+'<div class="tag">'+x.g+' '+x.n+'</div><div class="q">'+q[0]+'</div><div id="box"><button class="btn" id="open">答えを見る</button></div>';
    var timer=null,t0=Date.now(),done=false;
    function stop(){if(timer){clearInterval(timer);timer=null}}
    function reveal(late){
      var h='<div class="a"><small>答え</small>'+q[1]+'</div>';
      if(late){S[k(c[0],c[1])]=0;got[0]++;save();h='<p class="late" role="status">時間切れです。できなかったとして記録しました。</p>'+h+'<button class="btn" id="next">次へ</button>'}
      else h+='<div class="three"><button class="btn" data-v="2">できた</button><button class="btn" data-v="1">あやしい</button><button class="btn" data-v="0">できなかった</button></div>';
      document.getElementById("box").innerHTML=h;
      if(late){document.getElementById("next").onclick=function(){idx++;show()}}
      else Array.prototype.forEach.call(document.querySelectorAll(".three .btn"),function(b){b.onclick=function(){var v=+b.dataset.v;S[k(c[0],c[1])]=v;got[v]++;save();idx++;show()}});
    }
    document.getElementById("back").onclick=function(){stop();home()};
    document.getElementById("open").onclick=function(){done=true;stop();reveal(false)};
    if(T){var bar=document.getElementById("tmi");timer=setInterval(function(){var left=T*1000-(Date.now()-t0);bar.style.width=Math.max(0,left/(T*10))+"%";if(left<T*300)bar.className="low";if(left<=0){stop();if(!done){done=true;reveal(true)}}},100)}
    window.scrollTo(0,0);
  }
  show();
}
home();
</script>
